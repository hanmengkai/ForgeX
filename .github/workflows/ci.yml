name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forgex_test
          POSTGRES_USER: forgex
          POSTGRES_PASSWORD: forgex-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgex -d forgex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FORGEX_TEST_DATABASE_URL: postgresql://forgex:forgex-ci-only@127.0.0.1:5432/forgex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:all
      - run: npm run --workspace @forgex/verification-runner build:verifier
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
