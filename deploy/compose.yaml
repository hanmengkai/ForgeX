services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FORGEX_POSTGRES_DB:-forgex}
      POSTGRES_USER: ${FORGEX_POSTGRES_USER:-forgex}
      POSTGRES_PASSWORD: ${FORGEX_POSTGRES_PASSWORD:?请设置 FORGEX_POSTGRES_PASSWORD}
    volumes:
      - forgex-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: control-plane
    environment:
      FORGEX_DATABASE_URL: ${FORGEX_DATABASE_URL:?请设置已完成 URL 编码的 FORGEX_DATABASE_URL}
    command: ["npm", "run", "migrate", "--workspace", "@forgex/postgres"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  control-plane:
    build:
      context: ..
      dockerfile: Dockerfile
      target: control-plane
    restart: unless-stopped
    environment:
      FORGEX_DATABASE_URL: ${FORGEX_DATABASE_URL:?请设置已完成 URL 编码的 FORGEX_DATABASE_URL}
      FORGEX_CONTROL_PLANE_CONFIG: /run/forgex/control-plane.json
      FORGEX_CONTROL_PLANE_CONFIG_SHA256: ${FORGEX_CONTROL_PLANE_CONFIG_SHA256:?请设置控制面配置 SHA-256}
      FORGEX_BOOTSTRAP_ADMIN_USERNAME: ${FORGEX_BOOTSTRAP_ADMIN_USERNAME:-}
      FORGEX_BOOTSTRAP_ADMIN_NAME: ${FORGEX_BOOTSTRAP_ADMIN_NAME:-超级管理员}
      FORGEX_BOOTSTRAP_ADMIN_PASSWORD: ${FORGEX_BOOTSTRAP_ADMIN_PASSWORD:-}
      FORGEX_EXECUTION_LOG_ROOT: /var/lib/forgex/execution-logs
    volumes:
      - ./config/control-plane.json:/run/forgex/control-plane.json:ro
      - forgex-execution-logs:/var/lib/forgex/execution-logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ..
      dockerfile: apps/web-console/Dockerfile
      args:
        VITE_FORGEX_PROJECT_NAME: ${VITE_FORGEX_PROJECT_NAME:-我的项目}
        VITE_FORGEX_AGENT_DOWNLOAD_URL: ${VITE_FORGEX_AGENT_DOWNLOAD_URL:-https://gitee.com/hmk_855_admin/forge-x/repository/archive/master.zip}
    restart: unless-stopped
    ports:
      - "${FORGEX_HTTP_PORT:-8080}:8080"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  forgex-postgres:
  forgex-execution-logs:
