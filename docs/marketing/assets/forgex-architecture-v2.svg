<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102b50"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1267e8"/>
      <stop offset="1" stop-color="#18b7ff"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#41c9ff"/></marker>
    <style>
      .title{font:700 48px 'Microsoft YaHei',sans-serif;fill:#fff}.sub{font:400 22px 'Microsoft YaHei',sans-serif;fill:#9cc5e9}
      .head{font:700 28px 'Microsoft YaHei',sans-serif;fill:#fff}.body{font:400 19px 'Microsoft YaHei',sans-serif;fill:#c8def2}
      .tag{font:600 17px Consolas,'Microsoft YaHei',sans-serif;fill:#79dbff}.line{stroke:#41c9ff;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#496d94;stroke-width:2;stroke-dasharray:9 9;fill:none}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity=".12" stroke="#67b8ff"><path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600M0 840H1600M180 0V1000M360 0V1000M540 0V1000M720 0V1000M900 0V1000M1080 0V1000M1260 0V1000M1440 0V1000"/></g>
  <text x="80" y="85" class="title">ForgeX 技术架构：把“会写代码”拆成可信交付链</text>
  <text x="80" y="125" class="sub">控制面负责状态与规则，Worker 负责实现，Runner 负责独立举证，人负责最终判断</text>

  <g filter="url(#shadow)"><rect x="70" y="190" width="310" height="225" rx="24" fill="#102846" stroke="#2878ba" stroke-width="2"/></g>
  <text x="105" y="240" class="tag">01 / BUSINESS INPUT</text><text x="105" y="288" class="head">Web Console</text>
  <text x="105" y="330" class="body">版本化需求 · 澄清 · 验收条件</text><text x="105" y="365" class="body">业务状态 · Preview · 人工审批</text>

  <g filter="url(#shadow)"><rect x="490" y="175" width="430" height="260" rx="28" fill="url(#blue)"/></g>
  <text x="535" y="230" class="tag" fill="#d9f5ff">02 / ORCHESTRATION</text><text x="535" y="282" class="head">Control Plane API</text>
  <text x="535" y="330" class="body" fill="#fff">权威状态机 · HATEOAS Actions</text><text x="535" y="366" class="body" fill="#fff">租约 · fencing · 审计 · 权限边界</text><text x="535" y="402" class="body" fill="#fff">不保存 Codex / MCP 明文凭据</text>

  <g filter="url(#shadow)"><rect x="1030" y="175" width="490" height="260" rx="28" fill="#102846" stroke="#2878ba" stroke-width="2"/></g>
  <text x="1075" y="230" class="tag">03 / DURABLE STATE</text><text x="1075" y="282" class="head">PostgreSQL</text>
  <text x="1075" y="330" class="body">需求快照 + 审计 + Delivery Outbox</text><text x="1075" y="366" class="body">Worker Fleet + 永久完成证明</text><text x="1075" y="402" class="body">迁移账本 + advisory transaction lock</text>

  <path d="M380 300H490" class="line"/><path d="M920 300H1030" class="line"/>

  <g filter="url(#shadow)"><rect x="70" y="550" width="570" height="315" rx="28" fill="#102846" stroke="#2878ba" stroke-width="2"/></g>
  <text x="115" y="605" class="tag">04 / LOCAL EXECUTION</text><text x="115" y="655" class="head">Device Worker × N</text>
  <rect x="115" y="695" width="145" height="115" rx="15" fill="#173a61"/><rect x="285" y="695" width="145" height="115" rx="15" fill="#173a61"/><rect x="455" y="695" width="145" height="115" rx="15" fill="#173a61"/>
  <text x="143" y="738" class="tag">worktree A</text><text x="313" y="738" class="tag">worktree B</text><text x="483" y="738" class="tag">worktree N</text>
  <text x="141" y="777" class="body">Codex SDK</text><text x="311" y="777" class="body">Codex SDK</text><text x="481" y="777" class="body">Codex SDK</text>
  <text x="115" y="842" class="body">出站轮询 · 本地凭据 · 独立分支 · 提交意图 journal</text>

  <g filter="url(#shadow)"><rect x="760" y="550" width="370" height="315" rx="28" fill="#0d3850" stroke="#2ad4d0" stroke-width="3"/></g>
  <text x="805" y="605" class="tag" fill="#55f2df">05 / INDEPENDENT PROOF</text><text x="805" y="655" class="head">Verification Runner</text>
  <text x="805" y="705" class="body">精确 repositoryKey + commitSha</text><text x="805" y="742" class="body">受限容器运行固定验证套件</text><text x="805" y="779" class="body">Ed25519 签名 Evidence</text><text x="805" y="816" class="body">内容寻址 Preview（SHA-256）</text>

  <g filter="url(#shadow)"><rect x="1250" y="550" width="270" height="315" rx="28" fill="#4a3116" stroke="#ffad42" stroke-width="3"/></g>
  <text x="1290" y="605" class="tag" fill="#ffd08a">06 / DECISION</text><text x="1290" y="655" class="head">人工验收闸门</text>
  <text x="1290" y="710" class="body">操作隔离 Preview</text><text x="1290" y="750" class="body">核对独立证据</text><text x="1290" y="790" class="body">决定验收，不等于发布</text>

  <path d="M705 435V500H355V550" class="line"/><path d="M640 708H760" class="line"/><path d="M1130 708H1250" class="line"/>
  <path d="M945 550V490H1275V435" class="dash"/>
  <text x="672" y="690" class="tag">候选提交</text><text x="1140" y="690" class="tag">签名证据</text>
  <text x="80" y="945" class="sub">关键不变量：开发者不能自证通过｜旧 fencing 不能覆盖新租约｜写操作结果未知时绝不自动重做</text>
</svg>
